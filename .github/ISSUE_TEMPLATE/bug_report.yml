name: Bug report
description: Report a reproducible theme or selector problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include subscription URLs, private image URLs, tokens, or Clash configuration secrets.
  - type: input
    id: version
    attributes:
      label: Clash Verge Rev version
      placeholder: 2.5.2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what is wrong and which page or component is affected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: dom
    attributes:
      label: Relevant DOM information
      description: Include stable classes or attributes. Remove private node and provider names.
  - type: checkboxes
    id: checks
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed subscription URLs, private image URLs, tokens, and private node information.
          required: true
