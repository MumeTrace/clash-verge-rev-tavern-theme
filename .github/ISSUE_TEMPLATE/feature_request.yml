name: Feature request
description: Suggest a compatible visual or maintenance improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clash Verge Rev version
      placeholder: 2.5.2
